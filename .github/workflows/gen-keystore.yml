name: Generate & Store Signing Keystore

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate-keystore:
    name: Generate Keystore & Set Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias mh-release \
            -keyalg RSA \
            -keysize 4096 \
            -validity 36500 \
            -keystore signing-key.jks \
            -storepass MH_Store_2026! \
            -keypass MH_Key_2026! \
            -dname "CN=Mobile Harness, OU=RD7890, O=MobileHarness, L=Unknown, ST=Unknown, C=US" \
            -storetype JKS
          echo "✅ Keystore generated"
          keytool -list -v -keystore signing-key.jks -storepass MH_Store_2026! | grep -E "Alias|Valid|SHA"

      - name: Base64 encode keystore
        run: |
          B64=$(base64 -w 0 signing-key.jks)
          echo "KEYSTORE_B64_LENGTH=${#B64}" 
          echo "keystore_b64=$B64" >> $GITHUB_OUTPUT
          echo "✅ Encoded: ${#B64} chars"
        id: encode

      - name: Upload secrets to GitHub via API
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          KEYSTORE_B64: ${{ steps.encode.outputs.keystore_b64 }}
        run: |
          REPO="RD7890/Mobile-Harness"

          # Get repo public key for secret encryption
          PUB_KEY_RESP=$(curl -s -H "Authorization: token $GH_PAT" \
            "https://api.github.com/repos/$REPO/actions/secrets/public-key")
          KEY_ID=$(echo "$PUB_KEY_RESP" | grep -o '"key_id":"[^"]*"' | cut -d'"' -f4)
          PUB_KEY=$(echo "$PUB_KEY_RESP" | grep -o '"key":"[^"]*"' | cut -d'"' -f4)

          echo "key_id=$KEY_ID"

          # Install PyNaCl for encryption
          pip install PyNaCl -q

          # Encrypt and upload each secret
          python3 << 'PYEOF'
          import base64, os, sys
          from nacl import encoding, public

          def encrypt(pub_key_b64: str, value: str) -> str:
              pub_key = public.PublicKey(pub_key_b64.encode(), encoding.Base64Encoder())
              box = public.SealedBox(pub_key)
              return base64.b64encode(box.encrypt(value.encode())).decode()

          import subprocess, json

          repo = "RD7890/Mobile-Harness"
          pat = os.environ["GH_PAT"]
          pub_key_b64 = os.environ["PUB_KEY"]
          key_id = os.environ["KEY_ID"]

          secrets = {
              "SIGNING_KEYSTORE_B64": os.environ["KEYSTORE_B64"],
              "SIGNING_STORE_PASSWORD": "MH_Store_2026!",
              "SIGNING_KEY_ALIAS": "mh-release",
              "SIGNING_KEY_PASSWORD": "MH_Key_2026!",
          }

          for name, value in secrets.items():
              encrypted = encrypt(pub_key_b64, value)
              payload = json.dumps({"encrypted_value": encrypted, "key_id": key_id})
              result = subprocess.run([
                  "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}",
                  "-X", "PUT",
                  "-H", f"Authorization: token {pat}",
                  "-H", "Content-Type: application/json",
                  f"https://api.github.com/repos/{repo}/actions/secrets/{name}",
                  "-d", payload
              ], capture_output=True, text=True)
              print(f"  {name}: HTTP {result.stdout.strip()}")
          PYEOF
        env:
          PUB_KEY: ${{ env.PUB_KEY }}
          KEY_ID: ${{ env.KEY_ID }}

      - name: Done
        run: echo "✅ All 4 signing secrets set on RD7890/Mobile-Harness"
