name: Generate & Store Signing Keystore

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate-keystore:
    name: Generate Keystore & Set Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore, encode, and store as secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 1. Generate the keystore
          keytool -genkeypair \
            -alias mh-release \
            -keyalg RSA \
            -keysize 4096 \
            -validity 36500 \
            -keystore signing-key.jks \
            -storepass 'MH_Store_2026!' \
            -keypass 'MH_Key_2026!' \
            -dname "CN=Mobile Harness, OU=RD7890, O=MobileHarness, L=Unknown, ST=Unknown, C=US" \
            -storetype JKS
          echo "✅ Keystore generated"
          keytool -list -v -keystore signing-key.jks -storepass 'MH_Store_2026!' | grep -E "Alias|Valid|SHA"

          # 2. Encode to base64
          KEYSTORE_B64=$(base64 -w 0 signing-key.jks)
          echo "Encoded size: ${#KEYSTORE_B64} chars"

          # 3. Install PyNaCl and push all secrets
          pip install PyNaCl -q

          python3 - "$KEYSTORE_B64" << 'PYEOF'
          import base64, json, sys, os
          from nacl import encoding, public
          import urllib.request

          def encrypt(pub_key_b64, value):
              pk = public.PublicKey(pub_key_b64.encode(), encoding.Base64Encoder())
              return base64.b64encode(public.SealedBox(pk).encrypt(value.encode())).decode()

          repo = "RD7890/Mobile-Harness"
          pat  = os.environ["GH_PAT"]
          keystore_b64 = sys.argv[1]

          # Get public key
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/secrets/public-key",
              headers={"Authorization": f"token {pat}", "User-Agent": "keystore-setup"})
          with urllib.request.urlopen(req) as r:
              pk = json.loads(r.read())
          pub_key, key_id = pk["key"], pk["key_id"]

          secrets = {
              "SIGNING_KEYSTORE_B64":   keystore_b64,
              "SIGNING_STORE_PASSWORD": "MH_Store_2026!",
              "SIGNING_KEY_ALIAS":      "mh-release",
              "SIGNING_KEY_PASSWORD":   "MH_Key_2026!",
          }

          for name, value in secrets.items():
              payload = json.dumps({"encrypted_value": encrypt(pub_key, value), "key_id": key_id}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/secrets/{name}",
                  data=payload, method="PUT",
                  headers={"Authorization": f"token {pat}", "Content-Type": "application/json", "User-Agent": "ks"})
              try:
                  with urllib.request.urlopen(req) as r:
                      print(f"  {name}: HTTP {r.status} ✅")
              except Exception as e:
                  print(f"  {name}: FAILED {e}")
          PYEOF

      - name: Done
        run: echo "✅ Permanent keystore secrets stored — all future builds will be signed with the same key"
